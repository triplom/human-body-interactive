apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: human-body-interactive
  namespace: human-body-app
  labels:
    app.kubernetes.io/name: human-body-interactive
    app.kubernetes.io/component: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Uncomment if using cert-manager for TLS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # ingressClassName: nginx  # Uncomment if using nginx ingress controller
  rules:
    - host: human-body.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: human-body-interactive
                port:
                  name: http
  # Uncomment to enable TLS
  # tls:
  #   - hosts:
  #       - human-body.local
  #     secretName: human-body-tls
